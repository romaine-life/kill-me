name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - Dockerfile
      - .dockerignore
      - scripts/image-fingerprint.sh
      - k8s/**
      - .github/workflows/build-and-deploy.yaml
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref or commit SHA to build. Leave blank to build the dispatch revision."
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image, push, bump Helm values tag
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Bump commits are pushed straight to main, which the branch ruleset
          # forbids for GITHUB_TOKEN (GitHub Actions cannot be a bypass actor).
          # The write deploy key is the ruleset's DeployKey bypass actor, so CI
          # pushes keep working while PR merges still wait for required checks.
          ssh-key: ${{ secrets.MAIN_PUSH_DEPLOY_KEY }}

      - name: Resolve requested ref
        env:
          INPUT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          target_ref="${INPUT_REF:-$GITHUB_SHA}"
          if full_sha="$(git rev-parse --verify "${target_ref}^{commit}" 2>/dev/null)"; then
            :
          elif git show-ref --verify --quiet "refs/remotes/origin/${target_ref}"; then
            full_sha="$(git rev-parse "refs/remotes/origin/${target_ref}^{commit}")"
          elif git show-ref --verify --quiet "refs/tags/${target_ref}"; then
            full_sha="$(git rev-parse "refs/tags/${target_ref}^{commit}")"
          else
            echo "::error::Unable to resolve git_ref '${target_ref}' to a commit."
            exit 1
          fi

          git checkout --detach "$full_sha"
          echo "Resolved ${target_ref} -> ${full_sha}"
          echo "SOURCE_SHA=${full_sha}" >> "$GITHUB_ENV"

      - name: Resolve semantic application version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          existing_tag="$(git tag --points-at "${SOURCE_SHA}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          release_title="Versioned application release"
          create_tag=false
          create_release=false

          if [ -n "${existing_tag}" ]; then
            app_version="${existing_tag#v}"
            if ! gh release view "${existing_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              create_release=true
            fi
          elif [ -z "${latest_tag}" ]; then
            # The first release establishes a truthful baseline; it does not
            # pretend the package.json/Helm placeholders were prior releases.
            app_version="1.0.0"
            release_title="Initial versioned release"
            create_tag=true
            create_release=true
          else
            pulls="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls")"
            pull_count="$(jq 'length' <<<"${pulls}")"
            if [ "${pull_count}" -ne 1 ]; then
              echo "::error::Expected ${SOURCE_SHA} to be associated with exactly one pull request; found ${pull_count}."
              exit 1
            fi

            mapfile -t release_labels < <(jq -r \
              '.[0].labels[].name | select(startswith("release:"))' \
              <<<"${pulls}")
            if [ "${#release_labels[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one release:* label; found ${#release_labels[@]}."
              exit 1
            fi

            bump="${release_labels[0]#release:}"
            release_title="$(jq -r '.[0].title' <<<"${pulls}")"
            app_version="$(node scripts/next-app-version.mjs "${latest_tag#v}" "${bump}")"
            if [ "${bump}" != "none" ]; then
              create_tag=true
              create_release=true
            fi
          fi

          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "APP_VERSION=${app_version}"
            echo "APP_DEPLOYED_AT=${deployed_at}"
            echo "CREATE_VERSION_TAG=${create_tag}"
            echo "CREATE_GITHUB_RELEASE=${create_release}"
            echo "RELEASE_TITLE=${release_title}"
          } >> "$GITHUB_ENV"
          echo "Resolved ${SOURCE_SHA} as application v${app_version}"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name romainecr

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(scripts/image-fingerprint.sh \
            --image app \
            --dockerfile Dockerfile \
            --context . \
            --paths 'Dockerfile .dockerignore backend frontend' \
            | tee /tmp/kill-me-image-fingerprint.txt \
            | awk -F= '$1 == "fingerprint" { print $2 }')"
          echo "ALIAS_TAG=app-${fingerprint}" >> "$GITHUB_ENV"

      - name: Check existing image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if az acr repository show-tags \
              --name romainecr \
              --repository kill-me \
              --query "[?@=='${ALIAS_TAG}'] | [0]" \
              --output tsv | grep -qx "${ALIAS_TAG}"; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "Found reusable image romainecr.azurecr.io/kill-me:${ALIAS_TAG}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
            echo "No reusable image found for app fingerprint ${{ steps.fingerprint.outputs.fingerprint }}"
          fi

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: romainecr.azurecr.io/kill-me:${{ env.ALIAS_TAG }}
          build-args: |
            APP_BUILD_ID=${{ env.ALIAS_TAG }}
          cache-from: type=registry,ref=romainecr.azurecr.io/kill-me-build-cache:app
          cache-to: type=registry,ref=romainecr.azurecr.io/kill-me-build-cache:app,mode=max

      - name: Bump image tag in k8s/values.yaml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Quote the tag so YAML never reinterprets image tags.
          sed -i "s|^  tag: .*|  tag: \"${ALIAS_TAG}\"|" k8s/values.yaml
          sed -i "s|^  version: .*|  version: \"${APP_VERSION}\"|" k8s/values.yaml
          sed -i "s|^  deployedAt: .*|  deployedAt: \"${APP_DEPLOYED_AT}\"|" k8s/values.yaml

      - name: Commit and push tag bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/values.yaml
          if git diff --cached --quiet; then
            echo "No values changes to commit"
            exit 0
          fi
          git commit -m "chore: deploy kill-me v${APP_VERSION} as ${ALIAS_TAG} [skip ci]"
          git push origin HEAD:main

      - name: Publish semantic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CREATE_GITHUB_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version_tag="v${APP_VERSION}"
          if [ "${CREATE_VERSION_TAG}" = "true" ]; then
            git tag -a "${version_tag}" "${SOURCE_SHA}" -m "${version_tag}: ${RELEASE_TITLE}"
            git push origin "refs/tags/${version_tag}"
          fi
          if ! gh release view "${version_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${version_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --title "${version_tag} — ${RELEASE_TITLE}" \
              --generate-notes
          fi
