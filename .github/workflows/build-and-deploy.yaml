name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - Dockerfile
      - .dockerignore
      - k8s/**
      - .github/workflows/build-and-deploy.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image, push, bump kustomization tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Fetch MICROSOFT_CLIENT_ID from App Configuration
        # This repo's tofu/oauth.tf publishes the key
        # `workout/microsoft_oauth_client_id` — fetched here so the tofu-managed
        # value is the source of truth for the build.
        run: |
          MICROSOFT_CLIENT_ID=$(az appconfig kv show \
            --name infra-appconfig \
            --key workout/microsoft_oauth_client_id \
            --query value -o tsv)
          echo "MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}" >> $GITHUB_ENV

      - name: ACR login
        run: az acr login --name romainecr

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="romainecr.azurecr.io/kill-me:${TAG}"
          docker build \
            --build-arg BUILD_NUMBER="${TAG}" \
            --build-arg VITE_MICROSOFT_CLIENT_ID="${MICROSOFT_CLIENT_ID}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Bump image tag in k8s/values.yaml
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ env.TAG }}|" k8s/values.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/values.yaml
          if git diff --cached --quiet; then
            echo "No values changes to commit"
            exit 0
          fi
          git commit -m "chore: bump kill-me image to ${{ env.TAG }} [skip ci]"
          git push
