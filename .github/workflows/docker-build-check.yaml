name: Docker Build Check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref or commit SHA to build. Leave blank to build the dispatch revision."
        required: false
        type: string

permissions:
  contents: read
  # Required for azure/login OIDC on same-repo PRs and workflow_dispatch.
  id-token: write

concurrency:
  group: docker-build-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.git_ref || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve image source ref
        id: source
        env:
          INPUT_REF: ${{ inputs.git_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -n "${PR_HEAD_SHA}" ]; then
            full_sha="${PR_HEAD_SHA}"
          elif [ -n "${INPUT_REF}" ]; then
            if full_sha="$(git rev-parse --verify "${INPUT_REF}^{commit}" 2>/dev/null)"; then
              :
            elif git show-ref --verify --quiet "refs/remotes/origin/${INPUT_REF}"; then
              full_sha="$(git rev-parse "refs/remotes/origin/${INPUT_REF}^{commit}")"
            elif git show-ref --verify --quiet "refs/tags/${INPUT_REF}"; then
              full_sha="$(git rev-parse "refs/tags/${INPUT_REF}^{commit}")"
            else
              echo "::error::Unable to resolve git_ref '${INPUT_REF}' to a commit."
              exit 1
            fi
          else
            full_sha="$(git rev-parse HEAD)"
          fi
          git checkout --detach "$full_sha"
          echo "Resolved image source -> ${full_sha}"
          echo "sha=${full_sha}" >> "${GITHUB_OUTPUT}"
          echo "BUILD_NUMBER=${full_sha}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Azure + ACR login only run for trusted events (same-repo PRs and
      # workflow_dispatch). Fork PRs skip these and stay build-only below.
      # Wiring (azure/login@v3 OIDC client-id/tenant-id/subscription-id vars
      # and `az acr login --name romainecr`) is reused verbatim from
      # build-and-deploy.yaml.
      - name: Azure Login (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: ACR login
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: az acr login --name romainecr

      - name: Compute image fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          scripts/image-fingerprint.sh \
            --image app \
            --dockerfile Dockerfile \
            --context . \
            --paths 'Dockerfile .dockerignore backend frontend'

      - name: Check ACR candidate image
        id: candidate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.fingerprint.outputs.proof_tag }}"
          if az acr repository show-tags \
              --name romainecr \
              --repository kill-me \
              --query "[?@=='${tag}'] | [0]" \
              --output tsv | grep -qx "${tag}"; then
            echo "hit=true" >>"${GITHUB_OUTPUT}"
            echo "Found reusable image romainecr.azurecr.io/kill-me:${tag}"
          else
            echo "hit=false" >>"${GITHUB_OUTPUT}"
            echo "No reusable image found for app fingerprint ${{ steps.fingerprint.outputs.fingerprint }}"
          fi

      - name: Build and push candidate image
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.candidate.outputs.hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          load: false
          tags: romainecr.azurecr.io/kill-me:${{ steps.fingerprint.outputs.proof_tag }}
          build-args: |
            BUILD_NUMBER=${{ env.BUILD_NUMBER || github.event.pull_request.head.sha || github.sha }}
          cache-from: |
            type=registry,ref=romainecr.azurecr.io/kill-me-build-cache:app
            type=gha,scope=app
          cache-to: |
            type=registry,ref=romainecr.azurecr.io/kill-me-build-cache:app,mode=max
            type=gha,mode=max,scope=app

      - name: Tag app image by commit
        # Commit-addressed alias of the fingerprint manifest so Glimmung's
        # deploy-image resolver looks the image up by the verified commit SHA.
        # Additive alongside the ACR lookup tag during the sha-alias migration;
        # the run-scoped lookup tag is removed once the resolver reads sha-<commit>.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          canonical='${{ steps.fingerprint.outputs.proof_tag }}'
          commit_tag="sha-${{ steps.source.outputs.sha }}"
          az acr import --name romainecr \
            --source "romainecr.azurecr.io/kill-me:${canonical}" \
            --image "kill-me:${commit_tag}" \
            --force
          echo "Tagged romainecr.azurecr.io/kill-me:${commit_tag} -> ${canonical}"

      - name: Build image without pushing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          build-args: |
            BUILD_NUMBER=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
