name: Snapshot

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  tofu-outputs:
    uses: romaine-life/pipeline-templates/.github/workflows/tofu-outputs-template.yml@main
    with:
      storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      state_key: kill-me.tfstate
    secrets: inherit

  generate-and-commit:
    name: Generate snapshot.db and commit
    needs: tofu-outputs
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Bump commits are pushed straight to main, which the branch ruleset
          # forbids for GITHUB_TOKEN (GitHub Actions cannot be a bypass actor).
          # The write deploy key is the ruleset's DeployKey bypass actor, so CI
          # pushes keep working while PR merges still wait for required checks.
          ssh-key: ${{ secrets.MAIN_PUSH_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Install snapshot dependencies
        working-directory: ./snapshot
        run: npm ci

      - name: Resolve Cosmos DB endpoint from App Config
        id: cosmos
        run: |
          ENDPOINT=$(az appconfig kv show \
            --endpoint "${{ vars.AZURE_APP_CONFIG_ENDPOINT }}" \
            --auth-mode login \
            --key cosmos_db_endpoint \
            --query value -o tsv)
          echo "::add-mask::$ENDPOINT"
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

      - name: Generate SQLite snapshot
        working-directory: ./snapshot
        env:
          COSMOS_DB_ENDPOINT: ${{ steps.cosmos.outputs.endpoint }}
          COSMOS_DB_DATABASE_NAME: ${{ fromJSON(needs.tofu-outputs.outputs.outputs_json).cosmos_db_database_name }}
          COSMOS_DB_CONTAINER_NAME: ${{ fromJSON(needs.tofu-outputs.outputs.outputs_json).cosmos_db_container_name }}
        run: |
          rm -f ../frontend/public/snapshot.db
          node generate-snapshot.js --output ../frontend/public/snapshot.db

      - name: Commit snapshot.db to repo
        # The commit triggers build-and-deploy.yml (matches its frontend/**
        # paths filter), which rebuilds the Docker image with the new snapshot
        # baked into frontend/dist, commits the tag bump, ArgoCD rolls the pod.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/snapshot.db
          git diff --cached --quiet || git commit -m "Update snapshot.db"
          git push
