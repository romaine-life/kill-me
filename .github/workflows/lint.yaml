name: Lint

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    uses: romaine-life/pipeline-templates/.github/workflows/lint-template.yml@main
    with:
      working_directory: '.'

  check-removed-msal:
    name: Removed MSAL surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Guard against MSAL/legacy-auth reintroduction
        run: node scripts/check-removed-msal.mjs

  check-image-fingerprint-config:
    name: Image fingerprint config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Guard image tag identity
        run: node scripts/check-image-fingerprint-config.mjs
