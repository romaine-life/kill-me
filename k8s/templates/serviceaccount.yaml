# Federated to kill-me-identity (tofu/identity.tf::azurerm_federated_identity_credential.kill_me)
# instead of the shared infra-shared-identity. New identity is scoped to
# kill-me's actual surface: Cosmos data on dbs/WorkoutTrackerDB, KV
# App Config Data Reader at store level for the single cosmos_db_endpoint
# key config.js reads. (No Key Vault grant — sessions are delegated to
# auth.romaine.life via cookie forward, this pod signs nothing locally.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-shared
  namespace: kill-me
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: 2ba3e252-c553-4a57-8811-c29b51c06cd9
