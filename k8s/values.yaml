# The image tag is bumped by .github/workflows/build-and-deploy.yaml on every
# push to main (via `sed` on this file).
image:
  repository: romainecr.azurecr.io/kill-me
  # Quoted on purpose: a bare SHA like 4255e97 is valid YAML scientific notation; keep the quotes.
  tag: "b55a35c"
  pullPolicy: IfNotPresent

name: kill-me
namespace: kill-me

hostname: workout.romaine.life
renderMode: normal

testEnv:
  slotName: ""

serviceAccount: infra-shared
serviceAccountClientId: 2ba3e252-c553-4a57-8811-c29b51c06cd9

ingress:
  gatewayName: main
  gatewayNamespace: envoy-gateway-system
  certIssuer: letsencrypt-prod
  tlsSecret: kill-me-tls
